<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Travel Planner</title>

  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/footer.css"> 
  <link rel="stylesheet" href="../css/styles.css"> 
</head>

<body>

  <div id="header"></div>

  <main class="wrap">
    <div class="card">
      <div class="grid">

        <!-- Registro -->
        <div class="cell">
          <div class="label">Registro</div>
          <div class="subtext">Conoce las ventajas al registrarte.</div>
          <a href="register.html" class="search-btn">Registrarse</a>
        </div>

        <!-- Login -->
        <div class="cell">
          <div class="label">Inicio de sesión</div>

          <h3>Usuario:</h3>
          <input id="usuario" type="text" autocomplete="off">

          <h3>Contraseña:</h3>
          <input id="contrasena" type="password" autocomplete="off">

          <div class="subtext">
            ¿Ya tienes una cuenta? Inicia sesión para acceder a tus planes de viaje personalizados.
          </div>

          <button class="search-btn" id="loginBtn">Iniciar sesión</button>
        </div>

      </div>
    </div>
  </main> 

  <div id="footer"></div>

  <script src="../include.js"></script>

</body>
</html>
